services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manejoai
      POSTGRES_PASSWORD: manejoai
      POSTGRES_DB: manejoai
    ports:
      - '5432:5432'
    volumes:
      - manejoai_db_data:/var/lib/postgresql/data

volumes:
  manejoai_db_data:
